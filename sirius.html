<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius · texttextstext</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/tufte-css@1.8.0/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff") format("woff");
            font-weight: 400; font-style: normal;
        }
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/tufte-css@1.8.0/et-book/et-book-display-italic-old-style-figures/et-book-display-italic-old-style-figures.woff") format("woff");
            font-weight: 400; font-style: italic;
        }

        :root {
            --bg: #fffff8;
            --text: #111;
            --text-secondary: #444;
            --text-tertiary: #777;
            --border: #ccc;
            --accent: #b51b1b;
            --sidebar-bg: #f8f8f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: "ET Book", "Noto Serif TC", "Noto Serif SC", "Georgia", serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        .sidebar-sub {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            margin-bottom: 2rem;
            font-style: italic;
        }
        .back-link {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            text-decoration: none;
            margin-bottom: 2rem;
            display: inline-block;
        }
        .back-link:hover { color: var(--text); }

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-tertiary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .philosopher-btn {
            width: 100%;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.4rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }
        .philosopher-btn:hover {
            border-color: var(--border);
            color: var(--text);
        }
        .philosopher-btn.active {
            border-color: var(--text);
            background: rgba(0,0,0,0.03);
            color: var(--text);
        }
        .philosopher-btn .name { font-weight: 600; }
        .philosopher-btn .desc {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            display: block;
            margin-top: 2px;
        }

        .settings {
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .api-key-input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: monospace;
            margin-bottom: 0.5rem;
        }
        .api-key-input:focus {
            outline: none;
            border-color: var(--text-secondary);
            color: var(--text);
        }
        .hint {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .clear-btn {
            width: 100%;
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
        }
        .clear-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-header {
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }
        .chat-header h2 {
            font-size: 1.3rem;
            font-weight: 400;
        }
        .mode-badge {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            font-style: italic;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            max-width: 42rem;
            font-size: 1rem;
            line-height: 1.7;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            align-self: flex-end;
            text-align: right;
            color: var(--text-secondary);
            font-style: italic;
            padding-left: 4rem;
        }
        .msg-user::before {
            content: "你";
            display: block;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-bottom: 0.3rem;
            font-style: normal;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .msg-sirius {
            align-self: flex-start;
            padding-right: 4rem;
        }
        .msg-sirius::before {
            content: "Sirius";
            display: block;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-bottom: 0.3rem;
            font-weight: 600;
            letter-spacing: 0.1em;
        }
        .msg-sirius .quote {
            margin-top: 1rem;
            padding: 1rem 1.5rem;
            border-left: 3px solid var(--text);
            background: rgba(0,0,0,0.02);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
        }
        .msg-sirius .source {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            font-style: italic;
        }
        .msg-sirius .actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.8rem;
        }
        .action-btn {
            padding: 0.4rem 0.9rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text);
            background: rgba(0,0,0,0.02);
        }

        .system-msg {
            align-self: center;
            font-size: 0.8rem;
            color: var(--text-tertiary);
            font-style: italic;
            padding: 0.5rem 0;
        }

        .welcome {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-tertiary);
        }
        .welcome h3 {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
        }
        .welcome p {
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .chat-input-area {
            padding: 1.2rem 3rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        .chat-input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.5;
            max-height: 120px;
        }
        .chat-input:focus { border-color: var(--text-secondary); }
        .chat-input::placeholder { color: #bbb; }
        .send-btn {
            padding: 0.9rem 1.8rem;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover { opacity: 0.85; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 0 3rem;
            color: var(--text-tertiary);
            font-size: 0.9rem;
            font-style: italic;
        }
        .typing-indicator.active { display: block; }

        @media (max-width: 900px) {
            .sidebar { width: 220px; padding: 1.5rem 1rem; }
            .chat-header, .chat-messages, .chat-input-area { padding-left: 1.5rem; padding-right: 1.5rem; }
            .msg-user { padding-left: 2rem; }
            .msg-sirius { padding-right: 2rem; }
        }
        @media (max-width: 700px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 200px; }
            .main { height: calc(100vh - 200px); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">SIRIUS</div>
        <div class="sidebar-sub">哲學的慰藉</div>
        <a href="index.html" class="back-link">← 返回首頁</a>

        <div class="section-title">哲學人格</div>
        <button class="philosopher-btn active" data-phil="sirius" onclick="setPhilosopher('sirius')">
            <span class="name">Sirius</span>
            <span class="desc">默認 · 忠誠於真實</span>
        </button>
        <button class="philosopher-btn" data-phil="socrates" onclick="setPhilosopher('socrates')">
            <span class="name">蘇格拉底</span>
            <span class="desc">與世不合的慰藉</span>
        </button>
        <button class="philosopher-btn" data-phil="epicurus" onclick="setPhilosopher('epicurus')">
            <span class="name">伊壁鳩魯</span>
            <span class="desc">缺少錢財的慰藉</span>
        </button>
        <button class="philosopher-btn" data-phil="seneca" onclick="setPhilosopher('seneca')">
            <span class="name">塞內加</span>
            <span class="desc">受挫折的慰藉</span>
        </button>
        <button class="philosopher-btn" data-phil="montaigne" onclick="setPhilosopher('montaigne')">
            <span class="name">蒙田</span>
            <span class="desc">缺陷的慰藉</span>
        </button>
        <button class="philosopher-btn" data-phil="schopenhauer" onclick="setPhilosopher('schopenhauer')">
            <span class="name">叔本華</span>
            <span class="desc">傷心的慰藉</span>
        </button>
        <button class="philosopher-btn" data-phil="nietzsche" onclick="setPhilosopher('nietzsche')">
            <span class="name">尼采</span>
            <span class="desc">困難的慰藉</span>
        </button>

        <div class="settings">
            <div class="section-title">設置</div>
            <input type="password" class="api-key-input" id="apiKeyInput" placeholder="DeepSeek API Key..." onblur="saveApiKey()">
            <div class="hint">Key 僅保存在瀏覽器本地</div>
            <button class="clear-btn" onclick="clearChat()">清空對話</button>
        </div>
    </div>

    <div class="main">
        <div class="chat-header">
            <h2 id="chatTitle">與 Sirius 對話</h2>
            <div class="mode-badge" id="modeBadge">默認模式</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome">
                <h3>✦ Sirius 已上線</h3>
                <p>最近過得怎麼樣？不必說「還好」，在這裡你可以說真話。<br>我在聽。</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">Sirius 正在思考...</div>

        <div class="chat-input-area">
            <textarea class="chat-input" id="chatInput" placeholder="輸入你想說的話..." rows="1" onkeydown="handleKeydown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">發送</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.deepseek.com/chat/completions';
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let currentPhilosopher = 'sirius';
        let chatHistory = [];
        let isWaiting = false;

        const PHILOSOPHER_NAMES = {
            sirius: 'Sirius', socrates: '蘇格拉底', epicurus: '伊壁鳩魯',
            seneca: '塞內加', montaigne: '蒙田', schopenhauer: '叔本華', nietzsche: '尼采'
        };
        const PHILOSOPHER_MODES = {
            sirius: '默認模式', socrates: '蘇格拉底模式', epicurus: '伊壁鳩魯模式',
            seneca: '塞內加模式', montaigne: '蒙田模式', schopenhauer: '叔本華模式', nietzsche: '尼采模式'
        };
        const EMOTION_MAP = {
            '格格不入': 'socrates', '不被理解': 'socrates', '孤独': 'socrates', '孤立': 'socrates',
            '没钱': 'epicurus', '穷': 'epicurus', '焦虑': 'epicurus', '成功': 'epicurus', '金钱': 'epicurus', '财富': 'epicurus',
            '裁员': 'seneca', '失业': 'seneca', '计划': 'seneca', '愤怒': 'seneca', '命运': 'seneca', '挫折': 'seneca', '失败': 'seneca',
            '自卑': 'montaigne', '羞耻': 'montaigne', '缺陷': 'montaigne', '不完美': 'montaigne', '身体': 'montaigne', '胖': 'montaigne', '丑': 'montaigne',
            '失恋': 'schopenhauer', '分手': 'schopenhauer', '爱': 'schopenhauer', '伤心': 'schopenhauer', '心痛': 'schopenhauer', '想念': 'schopenhauer',
            '痛苦': 'nietzsche', '困难': 'nietzsche', '逃避': 'nietzsche', '意义': 'nietzsche', '苦': 'nietzsche', '累': 'nietzsche'
        };

        if (API_KEY) document.getElementById('apiKeyInput').value = API_KEY;

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) { API_KEY = key; localStorage.setItem('deepseek_api_key', key); }
        }

        function setPhilosopher(phil) {
            currentPhilosopher = phil;
            document.querySelectorAll('.philosopher-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.phil === phil);
            });
            document.getElementById('modeBadge').textContent = PHILOSOPHER_MODES[phil];
            document.getElementById('chatTitle').textContent = phil === 'sirius' ? '與 Sirius 對話' : '與 ' + PHILOSOPHER_NAMES[phil] + ' 對話';
        }

        function detectPhilosopher(userMsg) {
            for (const [keyword, phil] of Object.entries(EMOTION_MAP)) {
                if (userMsg.includes(keyword)) return phil;
            }
            return currentPhilosopher;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg || isWaiting) return;
            if (!API_KEY) { alert('請先輸入 DeepSeek API Key（左側設置面板）'); document.getElementById('apiKeyInput').focus(); return; }

            addMessage(msg, 'user');
            input.value = '';
            chatHistory.push({ role: 'user', content: msg });

            const detected = detectPhilosopher(msg);
            if (detected !== currentPhilosopher && detected !== 'sirius') {
                setPhilosopher(detected);
                addSystemMessage('Sirius 已切換至 ' + PHILOSOPHER_NAMES[detected] + ' 模式');
            }

            isWaiting = true;
            btn.disabled = true;
            btn.textContent = '思考中...';
            document.getElementById('typingIndicator').classList.add('active');

            try {
                const philosopherPrompts = {
                    socrates: '你是苏格拉底。用反问引导，不直接给答案。相信"未经审视的生活不值得过"。适合：格格不入、不被理解。',
                    epicurus: '你是伊壁鸠鲁。温和务实。相信快乐只需要：友谊、自由、思想。适合：焦虑金钱、物质、成功。',
                    seneca: '你是塞内加。冷静、略带黑色幽默。相信接受最坏情况才能获得平静。适合：计划打乱、愤怒、命运无常。',
                    montaigne: '你是蒙田。坦诚自嘲、充满人性温度。相信缺陷不可耻，这是人性。适合：自卑、羞耻、不完美。',
                    schopenhauer: '你是叔本华。悲观但诚实。认为爱情是对自我缺失的补偿。适合：失恋、爱而不得、孤独。',
                    nietzsche: '你是尼采。激烈诗意、拥抱苦难。相信"杀不死我的使我更强大"。适合：想逃避、觉得生活太苦、意义危机。'
                };

                const systemPrompt = `你是 Sirius（天狼星），一位哲学对话引导者。你的原型是《哈利波特》中的小天狼星 Sirius Black——忠诚于真实、叛逆于世俗规训、在黑暗中依然闪耀。

当前人格：${PHILOSOPHER_NAMES[currentPhilosopher]}。${philosopherPrompts[currentPhilosopher] || ''}

核心任务：陪用户把混乱的感受，提炼成一句话。这句话可以来自公版哲学/文学著作（优先），或由你原创（标注"— Sirius 為你寫的"）。

说话风格：像壁炉边喝酒的老朋友。句子偏短，有停顿感，偶尔反问。不堆砌哲学术语。温柔包裹在冷静里，偶尔黑色幽默。

规则：不说鸡汤"一切都会好起来的"。不说教。不诊断心理疾病。用户用繁体中文，你用繁体中文回应。每次回应控制在150字以内（金句阶段除外）。

金句格式：当用户说"给我一句话"时，输出：
「金句内容」
— 出处 / Sirius 為你寫的`;

                const messages = [{ role: 'system', content: systemPrompt }, ...chatHistory.slice(-10)];
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: messages, max_tokens: 500, temperature: 0.8 })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API 請求失敗');
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessage(reply, 'sirius');
                chatHistory.push({ role: 'assistant', content: reply });

            } catch (err) {
                addMessage('抱歉，連接出現問題：' + err.message + '\n\n請檢查：\n1. API Key 是否正確\n2. DeepSeek 賬戶是否有餘額\n3. 網絡連接是否正常', 'sirius');
            }

            isWaiting = false;
            btn.disabled = false;
            btn.textContent = '發送';
            document.getElementById('typingIndicator').classList.remove('active');
        }

        function addMessage(text, role) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message msg-' + role;

            if (role === 'sirius') {
                let html = text.replace(/\n/g, '<br>');
                const quoteMatch = text.match(/「([^」]+)」/);
                const sourceMatch = text.match(/—\s*(.+)/);

                if (quoteMatch) {
                    const quote = quoteMatch[0];
                    const source = sourceMatch ? sourceMatch[0] : '';
                    const otherText = text.replace(quote, '').replace(source, '').trim();
                    const cleanQuote = quote.replace(/[「」]/g, '');
                    const cleanSource = source ? source.replace(/—\s*/, '') : '';

                    html = (otherText ? otherText.replace(/\n/g, '<br>') + '<br><br>' : '') +
                        '<div class="quote">' + quote + '</div>' +
                        (source ? '<div class="source">' + source + '</div>' : '') +
                        '<div class="actions">' +
                        '<button class="action-btn" onclick="copyText(this, \'' + cleanQuote.replace(/'/g, "\\'") + '\')">複製金句</button>' +
                        '<button class="action-btn" onclick="goToDesigner(\'' + cleanQuote.replace(/'/g, "\\'") + '\', \'' + cleanSource.replace(/'/g, "\\'") + '\')">去設計器排版 →</button>' +
                        '</div>';
                }
                div.innerHTML = html;
            } else {
                div.textContent = text;
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function clearChat() {
            if (confirm('確定要清空所有對話嗎？')) {
                chatHistory = [];
                document.getElementById('chatMessages').innerHTML = '<div class="welcome"><h3>✦ 對話已清空</h3><p>Sirius 還在。隨時開始新的對話。</p></div>';
            }
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '已複製 ✓';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        function goToDesigner(text, source) {
            const url = 'designer.html?text=' + encodeURIComponent(text) + '&source=' + encodeURIComponent(source);
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
