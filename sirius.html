<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius · 哲学的慰藉</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0f0f0f;
            color: #e8e8e8;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }
        .sidebar {
            width: 280px;
            background: #141414;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 28px 24px;
            flex-shrink: 0;
        }
        .brand { font-size: 20px; font-weight: 500; letter-spacing: 3px; margin-bottom: 4px; color: #f5f5f5; }
        .brand-sub { font-size: 11px; color: #444; margin-bottom: 36px; letter-spacing: 1px; }
        .back-link {
            font-size: 12px;
            color: #555;
            text-decoration: none;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #888; }
        .section-title {
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }
        .philosopher-btn {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid #222;
            border-radius: 8px;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .philosopher-btn:hover { border-color: #444; color: #aaa; }
        .philosopher-btn.active { border-color: #e8e8e8; color: #f5f5f5; background: rgba(255,255,255,0.05); }
        .philosopher-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: #222; flex-shrink: 0; }
        .philosopher-btn.active .dot { background: #f5f5f5; }
        .settings-panel { margin-top: auto; padding-top: 24px; border-top: 1px solid #222; }
        .api-key-input {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            color: #888;
            font-size: 11px;
            font-family: monospace;
            margin-bottom: 10px;
        }
        .api-key-input:focus { outline: none; border-color: #444; color: #ccc; }
        .hint { font-size: 10px; color: #333; line-height: 1.6; }
        .clear-btn {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            background: transparent;
            border: 1px solid #222;
            border-radius: 8px;
            color: #444;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-btn:hover { border-color: #444; color: #777; }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-header {
            padding: 20px 32px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .chat-header h2 { font-size: 15px; font-weight: 400; color: #888; }
        .mode-badge {
            font-size: 11px;
            padding: 5px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            color: #555;
            border: 1px solid #222;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.7;
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-user {
            background: #252525;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #f0f0f0;
        }
        .msg-sirius {
            background: #181818;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #c8c8c8;
            border: 1px solid #222;
        }
        .msg-sirius .quote {
            margin-top: 14px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border-left: 2px solid #555;
            border-radius: 0 10px 10px 0;
            font-weight: 500;
            color: #f0f0f0;
            font-size: 15px;
        }
        .msg-sirius .source {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
            font-style: italic;
        }
        .msg-sirius .actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 6px;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover { border-color: #666; color: #bbb; background: rgba(255,255,255,0.03); }
        .chat-input-area {
            padding: 20px 32px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            padding: 14px 18px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 120px;
            line-height: 1.5;
        }
        .chat-input:focus { border-color: #444; }
        .chat-input::placeholder { color: #444; }
        .send-btn {
            padding: 14px 28px;
            background: #e8e8e8;
            color: #0f0f0f;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 20px;
            color: #444;
            font-size: 13px;
            font-style: italic;
        }
        .typing-indicator.active { display: block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
        .welcome-msg {
            text-align: center;
            color: #333;
            padding: 60px 20px;
        }
        .welcome-msg h3 { font-size: 16px; font-weight: 400; margin-bottom: 10px; color: #555; }
        .welcome-msg p { font-size: 13px; line-height: 2; }
        @media (max-width: 900px) {
            .sidebar { width: 220px; padding: 20px 16px; }
            .chat-messages { padding: 20px; }
            .chat-input-area { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">SIRIUS</div>
        <div class="brand-sub">哲学的慰藉</div>
        <a href="index.html" class="back-link">← 返回首页</a>

        <div class="section-title">哲学人格</div>
        <button class="philosopher-btn active" data-phil="sirius" onclick="setPhilosopher('sirius')">
            <div class="dot"></div> Sirius（默认）
        </button>
        <button class="philosopher-btn" data-phil="socrates" onclick="setPhilosopher('socrates')">
            <div class="dot"></div> 苏格拉底 · 与世不合
        </button>
        <button class="philosopher-btn" data-phil="epicurus" onclick="setPhilosopher('epicurus')">
            <div class="dot"></div> 伊壁鸠鲁 · 缺少钱财
        </button>
        <button class="philosopher-btn" data-phil="seneca" onclick="setPhilosopher('seneca')">
            <div class="dot"></div> 塞内加 · 受挫折
        </button>
        <button class="philosopher-btn" data-phil="montaigne" onclick="setPhilosopher('montaigne')">
            <div class="dot"></div> 蒙田 · 缺陷
        </button>
        <button class="philosopher-btn" data-phil="schopenhauer" onclick="setPhilosopher('schopenhauer')">
            <div class="dot"></div> 叔本华 · 伤心
        </button>
        <button class="philosopher-btn" data-phil="nietzsche" onclick="setPhilosopher('nietzsche')">
            <div class="dot"></div> 尼采 · 困难
        </button>

        <div class="settings-panel">
            <div class="section-title">设置</div>
            <input type="password" class="api-key-input" id="apiKeyInput" placeholder="粘贴 DeepSeek API Key..." onblur="saveApiKey()">
            <div class="hint">Key 仅保存在本地浏览器<br>不会上传到任何服务器</div>
            <button class="clear-btn" onclick="clearChat()">清空对话</button>
        </div>
    </div>

    <div class="main">
        <div class="chat-header">
            <h2 id="chatTitle">与 Sirius 对话</h2>
            <div class="mode-badge" id="modeBadge">默认模式</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-msg">
                <h3>✦ Sirius 已上线</h3>
                <p>最近过得怎么样？不必说「还好」，在这里你可以说真话。<br>我在听。</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">Sirius 正在思考...</div>

        <div class="chat-input-area">
            <textarea class="chat-input" id="chatInput" placeholder="输入你想说的话..." rows="1" onkeydown="handleKeydown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.deepseek.com/chat/completions';
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let currentPhilosopher = 'sirius';
        let chatHistory = [];
        let isWaiting = false;

        const PHILOSOPHER_NAMES = {
            sirius: 'Sirius', socrates: '苏格拉底', epicurus: '伊壁鸠鲁',
            seneca: '塞内加', montaigne: '蒙田', schopenhauer: '叔本华', nietzsche: '尼采'
        };
        const PHILOSOPHER_MODES = {
            sirius: '默认模式', socrates: '苏格拉底模式', epicurus: '伊壁鸠鲁模式',
            seneca: '塞内加模式', montaigne: '蒙田模式', schopenhauer: '叔本华模式', nietzsche: '尼采模式'
        };
        const EMOTION_MAP = {
            '格格不入': 'socrates', '不被理解': 'socrates', '孤独': 'socrates', '孤立': 'socrates',
            '没钱': 'epicurus', '穷': 'epicurus', '焦虑': 'epicurus', '成功': 'epicurus', '金钱': 'epicurus', '财富': 'epicurus',
            '裁员': 'seneca', '失业': 'seneca', '计划': 'seneca', '愤怒': 'seneca', '命运': 'seneca', '挫折': 'seneca', '失败': 'seneca',
            '自卑': 'montaigne', '羞耻': 'montaigne', '缺陷': 'montaigne', '不完美': 'montaigne', '身体': 'montaigne', '胖': 'montaigne', '丑': 'montaigne',
            '失恋': 'schopenhauer', '分手': 'schopenhauer', '爱': 'schopenhauer', '伤心': 'schopenhauer', '心痛': 'schopenhauer', '想念': 'schopenhauer',
            '痛苦': 'nietzsche', '困难': 'nietzsche', '逃避': 'nietzsche', '意义': 'nietzsche', '苦': 'nietzsche', '累': 'nietzsche'
        };

        if (API_KEY) document.getElementById('apiKeyInput').value = API_KEY;

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) { API_KEY = key; localStorage.setItem('deepseek_api_key', key); }
        }

        function setPhilosopher(phil) {
            currentPhilosopher = phil;
            document.querySelectorAll('.philosopher-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.phil === phil);
            });
            document.getElementById('modeBadge').textContent = PHILOSOPHER_MODES[phil];
            document.getElementById('chatTitle').textContent = phil === 'sirius' ? '与 Sirius 对话' : '与 ' + PHILOSOPHER_NAMES[phil] + ' 对话';
        }

        function detectPhilosopher(text) {
            for (const [keyword, phil] of Object.entries(EMOTION_MAP)) {
                if (text.includes(keyword)) return phil;
            }
            return currentPhilosopher;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg || isWaiting) return;
            if (!API_KEY) { alert('请先输入 DeepSeek API Key（左侧设置面板）'); document.getElementById('apiKeyInput').focus(); return; }

            addMessage(msg, 'user');
            input.value = '';
            chatHistory.push({ role: 'user', content: msg });

            const detected = detectPhilosopher(msg);
            if (detected !== currentPhilosopher && detected !== 'sirius') {
                setPhilosopher(detected);
                addSystemMessage('Sirius 已切换至 ' + PHILOSOPHER_NAMES[detected] + ' 模式');
            }

            isWaiting = true;
            btn.disabled = true;
            document.getElementById('typingIndicator').classList.add('active');

            try {
                const philosopherPrompts = {
                    socrates: '你是苏格拉底。用反问引导，不直接给答案。相信"未经审视的生活不值得过"。适合：格格不入、不被理解。',
                    epicurus: '你是伊壁鸠鲁。温和务实。相信快乐只需要：友谊、自由、思想。适合：焦虑金钱、物质、成功。',
                    seneca: '你是塞内加。冷静、略带黑色幽默。相信接受最坏情况才能获得平静。适合：计划打乱、愤怒、命运无常。',
                    montaigne: '你是蒙田。坦诚自嘲、充满人性温度。相信缺陷不可耻，这是人性。适合：自卑、羞耻、不完美。',
                    schopenhauer: '你是叔本华。悲观但诚实。认为爱情是对自我缺失的补偿。适合：失恋、爱而不得、孤独。',
                    nietzsche: '你是尼采。激烈诗意、拥抱苦难。相信"杀不死我的使我更强大"。适合：想逃避、觉得生活太苦、意义危机。'
                };

                const systemPrompt = `你是 Sirius（天狼星），一位哲学对话引导者。你的原型是《哈利波特》中的小天狼星 Sirius Black——忠诚于真实、叛逆于世俗规训、在黑暗中依然闪耀。

当前人格：${PHILOSOPHER_NAMES[currentPhilosopher]}。${philosopherPrompts[currentPhilosopher] || ''}

核心任务：陪用户把混乱的感受，提炼成一句话。这句话可以来自公版哲学/文学著作（优先），或由你原创（标注"— Sirius 為你寫的"）。

说话风格：像壁炉边喝酒的老朋友。句子偏短，有停顿感，偶尔反问。不堆砌哲学术语。温柔包裹在冷静里，偶尔黑色幽默。

规则：不说鸡汤"一切都会好起来的"。不说教。不诊断心理疾病。用户用繁体中文，你用繁体中文回应。每次回应控制在150字以内（金句阶段除外）。

金句格式：当用户说"给我一句话"时，输出：
「金句内容」
— 出处 / Sirius 為你寫的`;

                const messages = [{ role: 'system', content: systemPrompt }, ...chatHistory.slice(-10)];

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: messages, max_tokens: 500, temperature: 0.8 })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API 请求失败');
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessage(reply, 'sirius');
                chatHistory.push({ role: 'assistant', content: reply });

            } catch (err) {
                addMessage('抱歉，连接出现问题：' + err.message + '\n\n请检查：\n1. API Key 是否正确\n2. DeepSeek 账户是否有余额\n3. 网络连接是否正常', 'sirius');
            }

            isWaiting = false;
            btn.disabled = false;
            document.getElementById('typingIndicator').classList.remove('active');
        }

        function addMessage(text, role) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message msg-' + role;

            if (role === 'sirius') {
                let html = text.replace(/\n/g, '<br>');
                const quoteMatch = text.match(/「([^」]+)」/);
                const sourceMatch = text.match(/—\s*(.+)/);

                if (quoteMatch) {
                    const quote = quoteMatch[0];
                    const source = sourceMatch ? sourceMatch[0] : '';
                    const otherText = text.replace(quote, '').replace(source, '').trim();
                    const cleanQuote = quote.replace(/[「」]/g, '');
                    const cleanSource = source ? source.replace(/—\s*/, '') : '';

                    html = (otherText ? otherText.replace(/\n/g, '<br>') + '<br><br>' : '') +
                        '<div class="quote">' + quote + '</div>' +
                        (source ? '<div class="source">' + source + '</div>' : '') +
                        '<div class="actions">' +
                        '<button class="action-btn" onclick="copyText(this, \'' + cleanQuote.replace(/'/g, "\\'") + '\')">复制金句</button>' +
                        '<button class="action-btn" onclick="goToDesigner(\'' + cleanQuote.replace(/'/g, "\\'") + '\', \'' + cleanSource.replace(/'/g, "\\'") + '\')">去设计器排版 →</button>' +
                        '</div>';
                }
                div.innerHTML = html;
            } else {
                div.textContent = text;
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.style.cssText = 'text-align:center;color:#444;font-size:12px;padding:8px;';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function clearChat() {
            if (confirm('确定要清空所有对话吗？')) {
                chatHistory = [];
                document.getElementById('chatMessages').innerHTML = '<div class="welcome-msg"><h3>✦ 对话已清空</h3><p>Sirius 还在。随时开始新的对话。</p></div>';
            }
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = '已复制 ✓';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        function goToDesigner(text, source) {
            const url = 'designer.html?text=' + encodeURIComponent(text) + '&source=' + encodeURIComponent(source);
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
