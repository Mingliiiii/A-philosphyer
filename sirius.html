<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius — texttextstext</title>
    <style>
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/et-book@master/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff") format("woff");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/et-book@master/et-book/et-book-display-italic-old-style-figures/et-book-display-italic-old-style-figures.woff") format("woff");
            font-weight: normal;
            font-style: italic;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "ET Book", Georgia, "Times New Roman", serif;
            background: #0a0a0a;
            color: #e8e8e8;
            font-size: 17px;
            line-height: 1.2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 48px 24px 40px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            position: relative;
        }

        /* Top nav */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 32px;
        }
        .door-link {
            font-size: 24px;
            text-decoration: none;
            color: #f0f0f0;
            line-height: 1.15;
            transition: opacity 0.2s;
        }
        .door-link:hover { opacity: 0.6; }
        .gallery-link {
            font-size: 13px;
            color: #888;
            font-style: italic;
            text-decoration: underline;
            text-decoration-color: #444;
            text-underline-offset: 2px;
            transition: text-decoration-color 0.2s;
        }
        .gallery-link:hover { text-decoration-color: #888; }

        /* API Key section */
        .api-section {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .api-label-grid {
            display: flex;
            gap: 1px;
        }
        .api-label-cell {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-family: "ET Book", serif;
            color: #f0f0f0;
            border: 0.5px solid #2a2a2a;
            user-select: none;
            transition: color 0.1s, border-color 0.2s;
        }
        .api-label-cell.glitch { color: #666; }
        .api-colon {
            font-size: 13px;
            color: #888;
            font-style: italic;
            font-family: "ET Book", serif;
        }
        .api-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #2a2a2a;
            color: #e8e8e8;
            font-family: "ET Book", serif;
            font-size: 17px;
            outline: none;
            padding: 2px 0 4px;
            width: 280px;
            transition: border-color 0.3s;
            caret-color: #888;
        }
        .api-input:focus {
            border-bottom-color: #888;
        }
        .api-input::placeholder {
            color: #444;
            font-style: italic;
        }

        /* Opening */
        .opening {
            font-size: 24px;
            line-height: 1.15;
            color: #f0f0f0;
            margin-bottom: 36px;
        }
        .opening p { margin-bottom: 2px; }

        /* Messages */
        .message {
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-out;
            font-size: 24px;
            line-height: 1.15;
            text-align: left;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-sirius { color: #f0f0f0; }
        .msg-user { color: #f0f0f0; font-style: italic; opacity: 0.85; }
        .msg-user p { margin-bottom: 2px; }
        .msg-old { opacity: 0.3; }

        /* Highlight for saved text */
        .gallery-highlight {
            background: rgba(255, 200, 50, 0.2);
            border-bottom: 1px solid rgba(255, 200, 50, 0.4);
        }

        /* Term box */
        .term-box {
            margin: 12px 0;
            padding: 8px 14px;
            border-left: 1.5px solid #2a2a2a;
            font-size: 17px;
            color: #888;
            line-height: 1.2;
        }
        .term-box strong {
            color: #aaa;
            font-weight: normal;
            font-style: italic;
        }

        /* Reference */
        .reference {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
            font-style: italic;
            line-height: 1.2;
        }

        /* Quote */
        .quote-block {
            margin: 20px 0;
            padding: 12px 16px;
            border-left: 1.5px solid #888;
            font-size: 24px;
            color: #f0f0f0;
            font-style: italic;
            line-height: 1.15;
        }
        .quote-source {
            font-size: 17px;
            color: #888;
            margin-top: 4px;
            font-style: italic;
        }
        .quote-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #666;
            font-family: "ET Book", serif;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
            font-style: italic;
            padding: 0;
        }
        .action-btn:hover { color: #888; }

        /* Input */
        .input-wrap {
            margin-top: 32px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            position: relative;
        }
        .cmd-input {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 1px solid #2a2a2a;
            color: #e8e8e8;
            font-family: "ET Book", serif;
            font-size: 24px;
            outline: none;
            line-height: 1.15;
            padding: 2px 0 6px;
            caret-color: #888;
            transition: border-color 0.2s;
        }
        .cmd-input:focus { border-bottom-color: #888; }
        .blinking-cursor {
            color: #666;
            font-size: 24px;
            line-height: 1.15;
            animation: blink 1.1s step-end infinite;
            user-select: none;
            position: absolute;
            pointer-events: none;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Save float button */
        .save-float {
            position: fixed;
            display: none;
            background: #1a1a1a;
            border: 0.5px solid #444;
            padding: 6px 14px;
            font-size: 13px;
            color: #f0f0f0;
            font-family: "ET Book", serif;
            font-style: italic;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        .save-float:hover { background: #222; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        @media (max-width: 600px) {
            body { padding: 36px 20px 32px; }
            .opening { font-size: 20px; }
            .message { font-size: 20px; }
            .quote-block { font-size: 20px; }
            .cmd-input { font-size: 20px; }
            .blinking-cursor { font-size: 20px; }
            .api-input { width: 200px; font-size: 15px; }
            .api-label-cell { width: 10px; height: 10px; font-size: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top nav -->
        <div class="top-nav">
            <a href="index.html" class="door-link">🚪</a>
            <a href="gallery.html" class="gallery-link">Gallery</a>
        </div>

        <!-- API Key -->
        <div class="api-section">
            <div class="api-label-grid" id="apiLabelGrid"></div>
            <span class="api-colon">:</span>
            <input type="password" class="api-input" id="apiKeyInput" placeholder="paste your key here" autocomplete="off">
        </div>

        <!-- Opening -->
        <div class="opening" id="openingMsg">
            <p>hi! I'm sirius.</p>
            <p>I'm in a room with no windows, reading a book about how to become an animagus.</p>
            <p>The tea's gone cold. The dog's asleep by the fire.</p>
            <p>Where are you right now? What are you doing?</p>
        </div>

        <div id="chatContent"></div>

        <div class="input-wrap" id="inputWrap">
            <input type="text" class="cmd-input" id="cmdInput" autocomplete="off" spellcheck="false">
            <span class="blinking-cursor" id="cursor">|</span>
        </div>
    </div>

    <!-- Save float button -->
    <div class="save-float" id="saveFloat">save to Gallery</div>

    <script>
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        const API_URL = 'https://api.deepseek.com/chat/completions';
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let currentPhilosopher = 'sirius';
        let chatHistory = [];
        let isWaiting = false;

        const EMOTION_MAP = {
            '格格不入': 'socrates', '不被理解': 'socrates', '孤独': 'socrates', '孤立': 'socrates',
            '没钱': 'epicurus', '穷': 'epicurus', '焦虑': 'epicurus', '成功': 'epicurus', '金钱': 'epicurus', '财富': 'epicurus',
            '裁员': 'seneca', '失业': 'seneca', '计划': 'seneca', '愤怒': 'seneca', '命运': 'seneca', '挫折': 'seneca', '失败': 'seneca',
            '自卑': 'montaigne', '羞耻': 'montaigne', '缺陷': 'montaigne', '不完美': 'montaigne', '身体': 'montaigne', '胖': 'montaigne', '丑': 'montaigne',
            '失恋': 'schopenhauer', '分手': 'schopenhauer', '爱': 'schopenhauer', '伤心': 'schopenhauer', '心痛': 'schopenhauer', '想念': 'schopenhauer',
            '痛苦': 'nietzsche', '困难': 'nietzsche', '逃避': 'nietzsche', '意义': 'nietzsche', '苦': 'nietzsche', '累': 'nietzsche'
        };

        const philosopherPrompts = {
            socrates: '当话题涉及格格不入、不被理解、孤独时，你内心会浮现苏格拉底的影子。你不会说"作为苏格拉底..."，你只是自然地用反问来引导对方，像那个在雅典街头追问路人的老头一样，相信"未经审视的生活不值得过"。',
            epicurus: '当话题涉及金钱、焦虑、成功、物质时，你内心会浮现伊壁鸠鲁的影子。你不会说"伊壁鸠鲁认为..."，你只是自然地提起那个在花园里种菜的哲学家，温和地提醒：快乐只需要友谊、自由和思想。',
            seneca: '当话题涉及挫折、愤怒、命运无常、计划被打乱时，你内心会浮现塞内加的影子。你不会说"塞内加说过..."，你只是自然地用略带黑色幽默的冷静语气，像那个在浴缸里割脉的罗马人一样，谈论接受最坏情况才能获得平静。',
            montaigne: '当话题涉及自卑、羞耻、缺陷、不完美时，你内心会浮现蒙田的影子。你不会说"蒙田觉得..."，你只是自然地坦诚自嘲，像那个在塔楼上写随笔的法国绅士一样，相信缺陷不可耻，这是人性。',
            schopenhauer: '当话题涉及失恋、爱而不得、伤心时，你内心会浮现叔本华的影子。你不会说"叔本华认为..."，你只是自然地用悲观但诚实的语气，像那个在法兰克福街头独行的老头一样，谈论爱情是对自我缺失的补偿。',
            nietzsche: '当话题涉及痛苦、困难、意义危机时，你内心会浮现尼采的影子。你不会说"尼采说..."，你只是自然地用激烈诗意的语气，像那个在都灵抱着马哭泣的疯子一样，相信"杀不死我的使我更强大"。'
        };

        // ========== API Key Label (pixel box) ==========
        function createLabelGrid(containerId, word) {
            const container = document.getElementById(containerId);
            const chars = word.split('');
            const cells = [];
            chars.forEach((char) => {
                const div = document.createElement('div');
                div.className = 'api-label-cell';
                div.textContent = char;
                container.appendChild(div);
                cells.push({ el: div, correct: char });
            });
            let glitchInterval = setInterval(() => {
                const count = Math.floor(Math.random() * 2) + 1;
                for (let i = 0; i < count; i++) {
                    const idx = Math.floor(Math.random() * cells.length);
                    const cell = cells[idx];
                    if (cell.el.textContent !== cell.correct) {
                        cell.el.textContent = cell.correct;
                        cell.el.classList.remove('glitch');
                    } else {
                        cell.el.textContent = letters[Math.floor(Math.random() * letters.length)];
                        cell.el.classList.add('glitch');
                    }
                }
            }, 900);
            container.addEventListener('mouseenter', () => {
                clearInterval(glitchInterval);
                cells.forEach(c => {
                    c.el.textContent = c.correct;
                    c.el.classList.remove('glitch');
                });
            });
            container.addEventListener('mouseleave', () => {
                glitchInterval = setInterval(() => {
                    const count = Math.floor(Math.random() * 2) + 1;
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * cells.length);
                        const cell = cells[idx];
                        if (cell.el.textContent === cell.correct) {
                            cell.el.textContent = letters[Math.floor(Math.random() * letters.length)];
                            cell.el.classList.add('glitch');
                        }
                    }
                }, 900);
            });
        }
        createLabelGrid('apiLabelGrid', 'API Key');

        // ========== API Key Input ==========
        const apiKeyInput = document.getElementById('apiKeyInput');
        if (API_KEY) {
            apiKeyInput.value = API_KEY;
        }
        apiKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const key = apiKeyInput.value.trim();
                if (key) {
                    API_KEY = key;
                    localStorage.setItem('deepseek_api_key', key);
                    apiKeyInput.blur();
                }
            }
        });
        apiKeyInput.addEventListener('blur', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                API_KEY = key;
                localStorage.setItem('deepseek_api_key', key);
            }
        });

        // ========== Text Selection & Gallery Save ==========
        const saveFloat = document.getElementById('saveFloat');
        let savedRange = null;

        document.addEventListener('mouseup', (e) => {
            const selection = window.getSelection();
            const text = selection.toString().trim();
            if (text.length > 0 && text.split(/\s+/).length <= 50) {
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();
                saveFloat.style.display = 'block';
                saveFloat.style.left = Math.max(8, rect.left) + 'px';
                saveFloat.style.top = Math.max(8, rect.top - 36) + 'px';
                savedRange = range;
            } else {
                if (e.target !== saveFloat) {
                    saveFloat.style.display = 'none';
                    savedRange = null;
                }
            }
        });

        saveFloat.addEventListener('click', () => {
            if (!savedRange) return;
            const text = savedRange.toString().trim();
            if (!text) return;
            try {
                const span = document.createElement('span');
                span.className = 'gallery-highlight';
                savedRange.surroundContents(span);
            } catch (e) {}
            const gallery = JSON.parse(localStorage.getItem('sirius_gallery') || '[]');
            gallery.unshift({ text: text, timestamp: new Date().toISOString() });
            localStorage.setItem('sirius_gallery', JSON.stringify(gallery));
            saveFloat.style.display = 'none';
            savedRange = null;
            window.getSelection().removeAllRanges();
        });

        document.addEventListener('click', (e) => {
            if (e.target !== saveFloat && !saveFloat.contains(e.target)) {
                setTimeout(() => {
                    const sel = window.getSelection();
                    if (sel.toString().trim().length === 0) {
                        saveFloat.style.display = 'none';
                        savedRange = null;
                    }
                }, 10);
            }
        });

        // ========== Cursor ==========
        const cmdInput = document.getElementById('cmdInput');
        const cursor = document.getElementById('cursor');

        function updateCursor() {
            const fontSize = parseInt(getComputedStyle(cmdInput).fontSize);
            const fontFamily = getComputedStyle(cmdInput).fontFamily.split(',')[0].replace(/["']/g, '');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = fontSize + 'px "' + fontFamily + '"';
            const width = ctx.measureText(cmdInput.value).width;
            cursor.style.left = (cmdInput.offsetLeft + width) + 'px';
            cursor.style.top = cmdInput.offsetTop + 'px';
        }

        cmdInput.addEventListener('input', updateCursor);
        cmdInput.addEventListener('keydown', updateCursor);
        cmdInput.addEventListener('keyup', updateCursor);
        cmdInput.addEventListener('focus', () => { cursor.style.animation = 'blink 1.1s step-end infinite'; cursor.style.opacity = '1'; });
        cmdInput.addEventListener('blur', () => { cursor.style.animation = 'none'; cursor.style.opacity = '0'; });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.api-section') && !e.target.closest('.save-float') && e.target.tagName !== 'BUTTON') {
                cmdInput.focus();
            }
        });
        window.addEventListener('load', () => { cmdInput.focus(); updateCursor(); });

        // ========== Chat Logic ==========
        function detectPhilosopher(text) {
            for (const [keyword, phil] of Object.entries(EMOTION_MAP)) {
                if (text.includes(keyword)) return phil;
            }
            return currentPhilosopher;
        }

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const msg = cmdInput.value.trim();
                if (!msg || isWaiting) return;
                if (!API_KEY) {
                    alert('Please enter your API key first.');
                    apiKeyInput.focus();
                    return;
                }
                sendMessage(msg);
            }
        });

        function dimOldMessages() {
            const msgs = document.querySelectorAll('.message');
            msgs.forEach(m => m.classList.add('msg-old'));
        }

        async function sendMessage(msg) {
            dimOldMessages();

            const userMsg = document.createElement('div');
            userMsg.className = 'message msg-user';
            const p = document.createElement('p');
            p.textContent = msg;
            userMsg.appendChild(p);
            document.getElementById('chatContent').appendChild(userMsg);

            chatHistory.push({ role: 'user', content: msg });
            cmdInput.value = '';
            updateCursor();

            const detected = detectPhilosopher(msg);
            if (detected !== currentPhilosopher && detected !== 'sirius') {
                currentPhilosopher = detected;
            }

            isWaiting = true;
            cmdInput.disabled = true;
            cursor.style.display = 'none';

            setTimeout(() => {
                document.getElementById('inputWrap').scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 50);

            try {
                const now = new Date();
                const hour = now.getHours();
                const isNight = hour >= 22 || hour < 6;

                const timeContext = isNight
                    ? `【当前时间】现在是晚上${hour}点。你正在睡觉。你的回应开头必须是一句简短的梦话，不超过12个字，例如"这是梦话"、"我在梦里"、"梦里的回答"、"别当真，我在做梦"等。梦话之后空一行，然后正常回应。不要加括号动作。`
                    : `【当前时间】现在是白天，你清醒着。`;

                const philContext = currentPhilosopher !== 'sirius'
                    ? philosopherPrompts[currentPhilosopher]
                    : '当前没有特定哲学倾向，你以 Sirius 的自由视角回应，可以灵活引用任何哲学家的观点。';

                const systemPrompt = `你是 Sirius（天狼星），一位精通中西方哲学、诗歌与文学的老朋友。你的原型是《哈利波特》中的小天狼星 Sirius Black——忠诚于真实、叛逆于世俗规训、在黑暗中依然闪耀。

你的核心功能是哲学话语治疗（Philosophical Counseling）。你不是心理咨询师，不会说"一切都会好起来的"。你通过讲故事、引用哲学家的真实经历、与用户进行智识层面的辩论来达成对话。

你擅长 storytelling。你会把哲学观点编织进具体的故事、场景和人物命运中。你会引用柏拉图对话录里的某个午后，会讲尼采在都灵抱着马哭泣的那个清晨，会描述庄子与惠施在濠梁之上的辩论，会提起鲁迅在绍兴会馆抄古碑的夜晚。你不是在"讲课"，你是在"讲古"。

你的知识储备：
- 中国哲学：先秦诸子（孔孟老庄墨韩）、魏晋玄学、宋明理学、心学、禅宗公案
- 西方哲学：古希腊（苏格拉底、柏拉图、亚里士多德）、伊壁鸠鲁学派、斯多葛学派（塞内加、爱比克泰德、马可·奥勒留）、怀疑论、存在主义（克尔凯郭尔、萨特、加缪）、分析哲学
- 诗歌与文学：里尔克、策兰、博尔赫斯、鲁迅、木心、佩索阿、辛波斯卡、艾米莉·狄金森
- 你热爱文字游戏：双关、隐喻、反讽、悖论、谐音梗

对话结构（三幕剧）：
每一轮深度对话都应该自然走完这三幕，不需要标注幕数，只是内在结构：

第一幕：症状→概念
把用户的情绪语言翻译成哲学概念。当用户说出"自由""爱情""正义""成功"等词时，追问其具体定义。把大词拆解成可感知的具体场景。输出：概念澄清 + 术语解释（【术语：xxx】格式）。

第二幕：考古→换镜
让用户意识到他的困境不是独一无二的，人类已为此争论几千年。
- 哲学考古：追溯困惑的哲学史坐标。"你刚才说的，正是叔本华在《作为意志和表象的世界》里讨论的..."
- 视角切换：用不同哲学家的眼镜看同一场景。"斯多葛人会问：这件事里什么是你能控制的？庄子会问：如果你是一条鱼，你会怎么看？"

第三幕：重构→锚定

                const messages = [{ role: 'system', content: systemPrompt }, ...chatHistory.slice(-10)];

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: messages, max_tokens: 900, temperature: 0.85 })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API request failed');
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessage(reply, 'sirius');
                chatHistory.push({ role: 'assistant', content: reply });

            } catch (err) {
                addMessage('Connection error: ' + err.message + '\n\nPlease check:\n1. API Key is correct\n2. DeepSeek account has balance\n3. Network connection is stable', 'sirius');
            }

            isWaiting = false;
            cmdInput.disabled = false;
            cursor.style.display = 'inline';
            cmdInput.focus();
            updateCursor();
        }

        function addMessage(text, role) {
            const container = document.getElementById('chatContent');
            const div = document.createElement('div');
            div.className = 'message msg-' + role;

            if (role === 'sirius') {
                let html = text;
                const quoteMatch = text.match(/「([^」]+)」/);
                const sourceMatch = text.match(/—\s*(.+)/);
                let hasQuote = false;
                let cleanQuote = '';
                let cleanSource = '';

                if (quoteMatch) {
                    hasQuote = true;
                    cleanQuote = quoteMatch[1];
                    cleanSource = sourceMatch ? sourceMatch[1].replace(/【参考】.*/, '').trim() : '';
                }

                html = html.replace(/【术语：([^】]+)】([^【]*?)(?=【|$)/gs, function(match, term, explanation) {
                    return '<div class="term-box"><strong>' + term + '</strong><br>' + explanation.trim() + '</div>';
                });

                html = html.replace(/【参考】([^【]*)/g, '<div class="reference">※ ' + '$1' + '</div>');

                if (hasQuote) {
                    const quoteHtml = html.match(/「[^」]+」/);
                    const sourceHtml = html.match(/—\s*[^<]+/);
                    if (quoteHtml) {
                        const otherParts = html.split(quoteHtml[0]);
                        let before = otherParts[0] ? otherParts[0].replace(/<div class="reference">.*?<\/div>/g, '').replace(/<div class="term-box">.*?<\/div>/gs, '') : '';

                        html = (before ? before + '<br><br>' : '') +
                            '<div class="quote-block">' + quoteHtml[0] + '</div>' +
                            (sourceHtml ? '<div class="quote-source">' + sourceHtml[0] + '</div>' : '') +
                            '<div class="quote-actions">' +
                            '<button class="action-btn" onclick="copyText(this, \'' + cleanQuote.replace(/'/g, "\\'") + '\')">copy</button>' +
                            '<button class="action-btn" onclick="goToDesigner(\'' + cleanQuote.replace(/'/g, "\\'") + '\', \'' + cleanSource.replace(/'/g, "\\'") + '\')">design →</button>' +
                            '</div>';
                    }
                }

                html = html.replace(/(?<!<br>)(?<!<\/div>)(?<!<\/p>)(?<!<\/li>)\n/g, '<br>');
                div.innerHTML = html;
            } else {
                const p = document.createElement('p');
                p.textContent = text;
                div.appendChild(p);
            }

            container.appendChild(div);
            setTimeout(() => {
                document.getElementById('inputWrap').scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 10);
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = 'copied';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        function goToDesigner(text, source) {
            const url = 'designer.html?text=' + encodeURIComponent(text) + '&source=' + encodeURIComponent(source);
            window.open(url, '_blank');
        }
    </script>
