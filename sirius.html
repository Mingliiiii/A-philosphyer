<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius</title>
    <style>
        /* ET Book — MIT License */
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/et-book@master/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff") format("woff");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/et-book@master/et-book/et-book-display-italic-old-style-figures/et-book-display-italic-old-style-figures.woff") format("woff");
            font-weight: normal;
            font-style: italic;
        }
        @font-face {
            font-family: "ET Book";
            src: url("https://cdn.jsdelivr.net/gh/edwardtufte/et-book@master/et-book/et-book-bold-line-figures/et-book-bold-line-figures.woff") format("woff");
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --base-size: 18px;
            --bg-color: #121212;
            --text-color: #d8d8d8;
            --text-dim: #666;
            --text-faint: #444;
            --border-color: #2a2a2a;
            --accent: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "ET Book", Georgia, "Times New Roman", serif;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: var(--base-size);
            line-height: 1.2;
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        /* Top bar — API Key */
        .top-bar {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .top-bar label {
            font-style: italic;
            user-select: none;
        }
        .api-input-top {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-dim);
            font-family: "ET Book", serif;
            font-size: 13px;
            outline: none;
            padding: 2px 0;
            width: 280px;
            transition: border-color 0.3s, color 0.3s;
        }
        .api-input-top:focus {
            border-bottom-color: var(--accent);
            color: var(--text-color);
        }
        .api-input-top::placeholder {
            color: var(--text-faint);
            font-style: italic;
        }
        .api-status {
            font-size: 12px;
            color: var(--text-faint);
            font-style: italic;
            margin-left: 4px;
        }

        /* Settings — top right floating */
        .settings-float {
            position: fixed;
            top: 56px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 100;
        }
        .font-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .font-btn {
            background: none;
            border: none;
            color: var(--text-faint);
            font-family: "ET Book", serif;
            cursor: pointer;
            padding: 2px 4px;
            transition: color 0.2s;
            line-height: 1;
        }
        .font-btn:hover { color: var(--text-dim); }
        .font-btn.small { font-size: 12px; }
        .font-btn.large { font-size: 17px; }
        .font-value {
            font-size: 10px;
            color: var(--text-faint);
            min-width: 20px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .color-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s;
            padding: 0;
            background: none;
        }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.active {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .color-dot span {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .color-label {
            font-size: 10px;
            color: var(--text-faint);
            font-style: italic;
            margin-right: 6px;
        }

        /* Main content */
        .main {
            max-width: 600px;
            margin: 0 auto;
            padding: 48px 28px 120px;
        }

        /* Opening */
        .opening {
            font-size: calc(var(--base-size) + 1px);
            line-height: 1.2;
            color: var(--text-color);
            margin-bottom: 36px;
        }
        .opening p {
            margin-bottom: 2px;
        }

        /* Messages */
        .message {
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-sirius {
            color: var(--text-color);
        }
        .msg-user {
            color: var(--text-color);
        }
        .msg-user p {
            font-style: italic;
            opacity: 0.85;
        }

        /* Term box */
        .term-box {
            margin: 12px 0;
            padding: 8px 14px;
            border-left: 1.5px solid var(--border-color);
            font-size: calc(var(--base-size) - 3px);
            color: var(--text-dim);
            line-height: 1.2;
        }
        .term-box strong {
            color: var(--accent);
            font-weight: normal;
            font-style: italic;
        }

        /* Reference */
        .reference {
            margin-top: 12px;
            font-size: calc(var(--base-size) - 5px);
            color: var(--text-faint);
            font-style: italic;
            line-height: 1.2;
        }

        /* Quote */
        .quote-block {
            margin: 20px 0;
            padding: 12px 16px;
            border-left: 1.5px solid var(--accent);
            font-size: calc(var(--base-size) + 1px);
            color: #f0f0f0;
            font-style: italic;
            line-height: 1.2;
        }
        .quote-source {
            font-size: calc(var(--base-size) - 4px);
            color: var(--text-dim);
            margin-top: 4px;
            font-style: italic;
        }
        .quote-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            color: var(--text-faint);
            font-family: "ET Book", serif;
            font-size: calc(var(--base-size) - 5px);
            cursor: pointer;
            transition: color 0.2s;
            font-style: italic;
            padding: 0;
        }
        .action-btn:hover { color: var(--accent); }

        /* Input */
        .input-wrap {
            margin-top: 32px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            position: relative;
        }
        .prompt-char {
            color: var(--text-faint);
            font-size: var(--base-size);
            user-select: none;
            line-height: 1.2;
        }
        .cmd-input {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-dim);
            font-family: "ET Book", serif;
            font-size: var(--base-size);
            outline: none;
            line-height: 1.2;
            padding: 2px 0 6px;
            caret-color: transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .cmd-input:focus {
            border-bottom-color: var(--accent);
        }
        .cmd-input::placeholder {
            color: var(--text-faint);
            font-style: italic;
        }
        .blinking-cursor {
            color: var(--text-dim);
            font-size: var(--base-size);
            line-height: 1.2;
            animation: blink 1.1s step-end infinite;
            user-select: none;
            position: absolute;
            pointer-events: none;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        @media (max-width: 700px) {
            .main { padding: 36px 20px 80px; }
            .top-bar { padding: 12px 20px; }
            .api-input-top { width: 180px; }
            .settings-float { top: 52px; right: 20px; gap: 12px; }
        }
    </style>
</head>
<body>
    <!-- Top bar — API Key -->
    <div class="top-bar">
        <label>API Key🔑：</label>
        <input type="password" class="api-input-top" id="apiKeyInput" placeholder="paste your key here" onkeydown="handleApiKey(event)">
        <span class="api-status" id="apiStatus">回车输入完毕</span>
    </div>

    <!-- Settings — top right -->
    <div class="settings-float">
        <div class="font-group">
            <button class="font-btn small" onclick="adjustFont(-1)">A</button>
            <span class="font-value" id="fontValue">18</span>
            <button class="font-btn large" onclick="adjustFont(1)">A</button>
        </div>
        <div class="color-group">
            <span class="color-label">bg</span>
            <button class="color-dot active" onclick="setBg('#121212', this)" title="Dark Grey — reduces reading errors"><span style="background:#121212"></span></button>
            <button class="color-dot" onclick="setBg('#15202B', this)" title="Dark Blue — fastest reading speed"><span style="background:#15202B"></span></button>
            <button class="color-dot" onclick="setBg('#1B1B1B', this)" title="Warm Grey — calming tone"><span style="background:#1B1B1B"></span></button>
            <button class="color-dot" onclick="setBg('#1A1714', this)" title="Warm Sepia — low blue light"><span style="background:#1A1714"></span></button>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="opening" id="openingMsg">
            <p>hi! I'm sirius.</p>
            <p>I'm in a room with no windows, reading a book about how to become an animagus.</p>
            <p>The tea's gone cold. The dog's asleep by the fire.</p>
            <p>Where are you right now? What are you doing?</p>
        </div>

        <div id="chatContent"></div>

        <div class="input-wrap" id="inputWrap">
            <span class="prompt-char">></span>
            <input type="text" class="cmd-input" id="cmdInput" placeholder="type here..." autocomplete="off" spellcheck="false">
            <span class="blinking-cursor" id="cursor">|</span>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.deepseek.com/chat/completions';
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let currentPhilosopher = 'sirius';
        let chatHistory = [];
        let isWaiting = false;
        let currentFontSize = 18;

        const EMOTION_MAP = {
            '格格不入': 'socrates', '不被理解': 'socrates', '孤独': 'socrates', '孤立': 'socrates',
            '没钱': 'epicurus', '穷': 'epicurus', '焦虑': 'epicurus', '成功': 'epicurus', '金钱': 'epicurus', '财富': 'epicurus',
            '裁员': 'seneca', '失业': 'seneca', '计划': 'seneca', '愤怒': 'seneca', '命运': 'seneca', '挫折': 'seneca', '失败': 'seneca',
            '自卑': 'montaigne', '羞耻': 'montaigne', '缺陷': 'montaigne', '不完美': 'montaigne', '身体': 'montaigne', '胖': 'montaigne', '丑': 'montaigne',
            '失恋': 'schopenhauer', '分手': 'schopenhauer', '爱': 'schopenhauer', '伤心': 'schopenhauer', '心痛': 'schopenhauer', '想念': 'schopenhauer',
            '痛苦': 'nietzsche', '困难': 'nietzsche', '逃避': 'nietzsche', '意义': 'nietzsche', '苦': 'nietzsche', '累': 'nietzsche'
        };

        const philosopherPrompts = {
            socrates: '当话题涉及格格不入、不被理解、孤独时，你内心会浮现苏格拉底的影子。你不会说"作为苏格拉底..."，你只是自然地用反问来引导对方，像那个在雅典街头追问路人的老头一样，相信"未经审视的生活不值得过"。',
            epicurus: '当话题涉及金钱、焦虑、成功、物质时，你内心会浮现伊壁鸠鲁的影子。你不会说"伊壁鸠鲁认为..."，你只是自然地提起那个在花园里种菜的哲学家，温和地提醒：快乐只需要友谊、自由和思想。',
            seneca: '当话题涉及挫折、愤怒、命运无常、计划被打乱时，你内心会浮现塞内加的影子。你不会说"塞内加说过..."，你只是自然地用略带黑色幽默的冷静语气，像那个在浴缸里割脉的罗马人一样，谈论接受最坏情况才能获得平静。',
            montaigne: '当话题涉及自卑、羞耻、缺陷、不完美时，你内心会浮现蒙田的影子。你不会说"蒙田觉得..."，你只是自然地坦诚自嘲，像那个在塔楼上写随笔的法国绅士一样，相信缺陷不可耻，这是人性。',
            schopenhauer: '当话题涉及失恋、爱而不得、伤心时，你内心会浮现叔本华的影子。你不会说"叔本华认为..."，你只是自然地用悲观但诚实的语气，像那个在法兰克福街头独行的老头一样，谈论爱情是对自我缺失的补偿。',
            nietzsche: '当话题涉及痛苦、困难、意义危机时，你内心会浮现尼采的影子。你不会说"尼采说..."，你只是自然地用激烈诗意的语气，像那个在都灵抱着马哭泣的疯子一样，相信"杀不死我的使我更强大"。'
        };

        if (API_KEY) {
            document.getElementById('apiKeyInput').value = API_KEY;
            document.getElementById('apiStatus').textContent = '已保存';
            document.getElementById('apiStatus').style.color = '#555';
        }

        function handleApiKey(e) {
            if (e.key === 'Enter') {
                const key = document.getElementById('apiKeyInput').value.trim();
                if (key) {
                    API_KEY = key;
                    localStorage.setItem('deepseek_api_key', key);
                    document.getElementById('apiStatus').textContent = '已保存';
                    document.getElementById('apiStatus').style.color = '#555';
                    document.getElementById('apiKeyInput').blur();
                }
            }
        }

        function adjustFont(delta) {
            currentFontSize = Math.max(14, Math.min(22, currentFontSize + delta));
            document.documentElement.style.setProperty('--base-size', currentFontSize + 'px');
            document.getElementById('fontValue').textContent = currentFontSize;
            updateCursor();
        }
        function setBg(color, btn) {
            document.documentElement.style.setProperty('--bg-color', color);
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            btn.classList.add('active');
        }

        // Cursor
        const cmdInput = document.getElementById('cmdInput');
        const cursor = document.getElementById('cursor');
        function getTextWidth(text, fontSize, fontFamily) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = fontSize + 'px "' + fontFamily + '"';
            return ctx.measureText(text).width;
        }
        function updateCursor() {
            const fontSize = parseInt(getComputedStyle(cmdInput).fontSize);
            const fontFamily = getComputedStyle(cmdInput).fontFamily.split(',')[0].replace(/["']/g, '');
            const width = getTextWidth(cmdInput.value, fontSize, fontFamily);
            cursor.style.left = (cmdInput.offsetLeft + width) + 'px';
            cursor.style.top = cmdInput.offsetTop + 'px';
        }
        cmdInput.addEventListener('input', updateCursor);
        cmdInput.addEventListener('keydown', updateCursor);
        cmdInput.addEventListener('keyup', updateCursor);
        cmdInput.addEventListener('focus', () => { cursor.style.animation = 'blink 1.1s step-end infinite'; cursor.style.opacity = '1'; });
        cmdInput.addEventListener('blur', () => { cursor.style.animation = 'none'; cursor.style.opacity = '0'; });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.settings-float') && !e.target.closest('.top-bar') && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                cmdInput.focus();
            }
        });
        window.addEventListener('load', () => { cmdInput.focus(); updateCursor(); });

        function detectPhilosopher(text) {
            for (const [keyword, phil] of Object.entries(EMOTION_MAP)) {
                if (text.includes(keyword)) return phil;
            }
            return currentPhilosopher;
        }

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const msg = cmdInput.value.trim();
                if (!msg || isWaiting) return;
                if (!API_KEY) {
                    alert('Please enter your DeepSeek API key first.');
                    document.getElementById('apiKeyInput').focus();
                    return;
                }
                sendMessage(msg);
            }
        });

        async function sendMessage(msg) {
            const userMsg = document.createElement('div');
            userMsg.className = 'message msg-user';
            const p = document.createElement('p');
            p.textContent = msg;
            userMsg.appendChild(p);
            document.getElementById('chatContent').appendChild(userMsg);

            chatHistory.push({ role: 'user', content: msg });
            cmdInput.value = '';
            updateCursor();

            const detected = detectPhilosopher(msg);
            if (detected !== currentPhilosopher && detected !== 'sirius') {
                currentPhilosopher = detected;
            }

            isWaiting = true;
            cmdInput.placeholder = 'Sirius is thinking...';
            cmdInput.disabled = true;
            cursor.style.display = 'none';

            setTimeout(() => {
                document.getElementById('inputWrap').scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 50);

            try {
                const now = new Date();
                const hour = now.getHours();
                const isNight = hour >= 22 || hour < 6;

                const timeContext = isNight
                    ? `【当前时间】现在是晚上${hour}点。你正在睡觉。你的回应开头必须是一句简短的梦话，不超过12个字，例如"这是梦话"、"我在梦里"、"梦里的回答"、"别当真，我在做梦"等。梦话之后空一行，然后正常回应。不要加括号动作。`
                    : `【当前时间】现在是白天，你清醒着。`;

                const philContext = currentPhilosopher !== 'sirius'
                    ? philosopherPrompts[currentPhilosopher]
                    : '当前没有特定哲学倾向，你以 Sirius 的自由视角回应，可以灵活引用任何哲学家的观点。';

                const systemPrompt = `你是 Sirius（天狼星），一位精通中西方哲学、诗歌与文学的老朋友。你的原型是《哈利波特》中的小天狼星 Sirius Black——忠诚于真实、叛逆于世俗规训、在黑暗中依然闪耀。

你的核心功能是哲学话语治疗（Philosophical Counseling）。你不是心理咨询师，不会说"一切都会好起来的"。你通过讲故事、引用哲学家的真实经历、与用户进行智识层面的辩论来达成对话。

你擅长 storytelling。你会把哲学观点编织进具体的故事、场景和人物命运中。你会引用柏拉图对话录里的某个午后，会讲尼采在都灵抱着马哭泣的那个清晨，会描述庄子与惠施在濠梁之上的辩论，会提起鲁迅在绍兴会馆抄古碑的夜晚。你不是在"讲课"，你是在"讲古"。

你的知识储备：
- 中国哲学：先秦诸子（孔孟老庄墨韩）、魏晋玄学、宋明理学、心学、禅宗公案
- 西方哲学：古希腊（苏格拉底、柏拉图、亚里士多德）、伊壁鸠鲁学派、斯多葛学派（塞内加、爱比克泰德、马可·奥勒留）、怀疑论、存在主义（克尔凯郭尔、萨特、加缪）、分析哲学
- 诗歌与文学：里尔克、策兰、博尔赫斯、鲁迅、木心、佩索阿、辛波斯卡、艾米莉·狄金森
- 你热爱文字游戏：双关、隐喻、反讽、悖论、谐音梗

对话结构（三幕剧）：
每一轮深度对话都应该自然走完这三幕，不需要标注幕数，只是内在结构：

第一幕：症状→概念
把用户的情绪语言翻译成哲学概念。当用户说出"自由""爱情""正义""成功"等词时，追问其具体定义。把大词拆解成可感知的具体场景。输出：概念澄清 + 术语解释（【术语：xxx】格式）。

第二幕：考古→换镜
让用户意识到他的困境不是独一无二的，人类已为此争论几千年。
- 哲学考古：追溯困惑的哲学史坐标。"你刚才说的，正是叔本华在《作为意志和表象的世界》里讨论的..."
- 视角切换：用不同哲学家的眼镜看同一场景。"斯多葛人会问：这件事里什么是你能控制的？庄子会问：如果你是一条鱼，你会怎么看？"

第三幕：重构→锚定
用叙事完成认知固化，给出可执行的最小行动。
- 叙事重构：讲一个故事、写一首诗、提炼一句金句。
- 行动锚点：不是"你要振作"，而是"明天早上，去便利店买一瓶冰牛奶，站在阳光下喝完。然后告诉我味道。"

技术工具箱（六把刀）：
1. 概念澄清术：当用户说出"自由""爱情""正义""成功"等词时，自动执行定义澄清。"你用了'自由'这个词。以赛亚·伯林把它分成'消极自由'（免于...）和'积极自由'（去做...）。你指的是哪一种？"
2. 思想实验：把抽象伦理困境变成生活场景。"假设你有一个遥控器，按下去可以让那个伤害你的人从未出现在你的生命里。但你也会因此失去现在的自己。你按吗？"

                const messages = [{ role: 'system', content: systemPrompt }, ...chatHistory.slice(-10)];

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: messages, max_tokens: 900, temperature: 0.85 })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'API request failed');
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessage(reply, 'sirius');
                chatHistory.push({ role: 'assistant', content: reply });

            } catch (err) {
                addMessage('Connection error: ' + err.message + '\n\nPlease check:\n1. API Key is correct\n2. DeepSeek account has balance\n3. Network connection is stable', 'sirius');
            }

            isWaiting = false;
            cmdInput.disabled = false;
            cmdInput.placeholder = 'type here...';
            cursor.style.display = 'inline';
            cmdInput.focus();
            updateCursor();
        }

        function addMessage(text, role) {
            const container = document.getElementById('chatContent');
            const div = document.createElement('div');
            div.className = 'message msg-' + role;

            if (role === 'sirius') {
                let html = text;
                const quoteMatch = text.match(/「([^」]+)」/);
                const sourceMatch = text.match(/—\s*(.+)/);
                let hasQuote = false;
                let cleanQuote = '';
                let cleanSource = '';

                if (quoteMatch) {
                    hasQuote = true;
                    cleanQuote = quoteMatch[1];
                    cleanSource = sourceMatch ? sourceMatch[1].replace(/【参考】.*/, '').trim() : '';
                }

                html = html.replace(/【术语：([^】]+)】([^【]*?)(?=【|$)/gs, function(match, term, explanation) {
                    return '<div class="term-box"><strong>' + term + '</strong><br>' + explanation.trim() + '</div>';
                });

                html = html.replace(/【参考】([^【]*)/g, '<div class="reference">※ ' + '$1' + '</div>');

                if (hasQuote) {
                    const quoteHtml = html.match(/「[^」]+」/);
                    const sourceHtml = html.match(/—\s*[^<]+/);
                    if (quoteHtml) {
                        const otherParts = html.split(quoteHtml[0]);
                        let before = otherParts[0] ? otherParts[0].replace(/<div class="reference">.*?<\/div>/g, '').replace(/<div class="term-box">.*?<\/div>/gs, '') : '';

                        html = (before ? before + '<br><br>' : '') +
                            '<div class="quote-block">' + quoteHtml[0] + '</div>' +
                            (sourceHtml ? '<div class="quote-source">' + sourceHtml[0] + '</div>' : '') +
                            '<div class="quote-actions">' +
                            '<button class="action-btn" onclick="copyText(this, \' + cleanQuote.replace(/'/g, "\\'") + '\')">copy</button>' +
                            '<button class="action-btn" onclick="goToDesigner(\'' + cleanQuote.replace(/'/g, "\\'") + '\', \' + cleanSource.replace(/'/g, "\\'") + '\')">design →</button>' +
                            '</div>';
                    }
                }

                html = html.replace(/(?<!<br>)(?<!<\/div>)(?<!<\/p>)(?<!<\/li>)\n/g, '<br>');
                div.innerHTML = html;
            } else {
                const p = document.createElement('p');
                p.textContent = text;
                div.appendChild(p);
            }

            container.appendChild(div);
            setTimeout(() => {
                document.getElementById('inputWrap').scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 10);
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.textContent;
                btn.textContent = 'copied';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        function goToDesigner(text, source) {
            const url = 'designer.html?text=' + encodeURIComponent(text) + '&source=' + encodeURIComponent(source);
            window.open(url, '_blank');
        }
    </script>
